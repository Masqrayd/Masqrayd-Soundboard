name: Standalone Windows x64 soundboard
on:
  push:
    branches: [feature/standalone-windows-soundboard]
    paths:
      - 'standalone/**'
      - '.github/workflows/standalone-windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements.txt pyinstaller
      - name: Verify source syntax
        run: python -m py_compile standalone/soundboard.py
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Masqrayd-Soundboard standalone/soundboard.py
      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/Masqrayd-Soundboard/Masqrayd-Soundboard.exe)) { throw "Executable not found" }
          Get-FileHash dist/Masqrayd-Soundboard/Masqrayd-Soundboard.exe -Algorithm SHA256
      - name: Package downloadable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Masqrayd-Soundboard -DestinationPath Masqrayd-Soundboard-Standalone-Windows-x64-ONEDIR.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Masqrayd-Soundboard-Standalone-Windows-x64-ONEDIR
          path: Masqrayd-Soundboard-Standalone-Windows-x64.zip
          if-no-files-found: error
